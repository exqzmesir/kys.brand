<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Каталог одежды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#111);
    --hint:var(--tg-theme-hint-color,#888);
    --btn:var(--tg-theme-button-color,#2481cc);
    --btn-text:var(--tg-theme-button-text-color,#fff);
    --card:var(--tg-theme-secondary-bg-color,#f2f2f5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .page{padding:0 16px 100px}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg)}
  .ttl{flex:1;font-size:20px;font-weight:700}
  .ic{position:relative;width:42px;height:42px;border:0;border-radius:12px;background:var(--card);color:var(--text);font-size:20px}
  .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--btn);color:var(--btn-text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  /* боковое меню */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .ov.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--bg);transform:translateX(-100%);transition:transform .25s;z-index:21;padding:20px 12px;overflow-y:auto}
  .drawer.open{transform:none}
  .dh{font-size:20px;font-weight:700;padding:4px 12px 14px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;font-size:16px;cursor:pointer}
  .item.on{background:var(--card);font-weight:600}
  .item span{font-size:22px;width:28px;text-align:center}
  /* товары */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border-radius:14px;padding:10px;cursor:pointer}
  .pic{position:relative;height:150px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px;background:rgba(127,127,127,.12);margin-bottom:8px;overflow:hidden}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .name{font-weight:600;font-size:15px}
  .price{color:var(--hint);font-size:14px;margin-top:2px}
  .big .pic{height:320px;font-size:96px}
  .desc{line-height:1.45;margin:10px 0}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .size{padding:8px 14px;border-radius:10px;background:var(--card);cursor:pointer;border:2px solid transparent}
  .size.on{border-color:var(--btn)}
  button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600}
  button.main:disabled{opacity:.4}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
  .row .pic{width:60px;height:60px;margin:0;font-size:28px;flex:none}
  .grow{flex:1}
  .qty{display:flex;align-items:center;gap:10px}
  .qty b{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .total{font-size:18px;font-weight:700;margin:14px 0}
  .empty{color:var(--hint);text-align:center;margin-top:60px}
  .back{color:var(--btn);cursor:pointer;margin:6px 0 10px;display:inline-block}
  .cartbar{position:fixed;left:16px;right:16px;bottom:16px;z-index:4}
</style>
</head>
<body>
<div id="app"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ================= НАСТРОЙКИ: меняйте здесь ================= */
const MANAGER  = 'exqzmesir';  // ваш username в Telegram БЕЗ значка @
const GREETING = 'Здравствуйте, выбрал эти товары!';
const CUR = '₽';

const CATS = [
  {id:'tshirts',   name:'Футболки',        icon:'👕'},
  {id:'pants',     name:'Штаны',           icon:'👖'},
  {id:'outerwear', name:'Верхняя одежда',  icon:'🧶'},
  {id:'jackets',   name:'Куртки',          icon:'🧥'}
];

// img — путь к фото в репозитории, например 'images/tshirt-basic.jpg'. Пусто = показывается эмодзи.
const PRODUCTS = [
  {id:1, cat:'tshirts',   name:'Футболка Basic',    price:1500, icon:'👕', img:'', sizes:['S','M','L','XL'],      desc:'Плотный хлопок 100%, свободный крой. Подходит на каждый день.'},
  {id:2, cat:'tshirts',   name:'Футболка Oversize', price:1900, icon:'👕', img:'', sizes:['M','L','XL'],          desc:'Оверсайз-силуэт, спущенное плечо, мягкая ткань.'},
  {id:3, cat:'pants',     name:'Джинсы Straight',   price:5500, icon:'👖', img:'', sizes:['30','32','34','36'],   desc:'Прямой крой, плотный деним, классическая посадка.'},
  {id:4, cat:'pants',     name:'Карго',             price:5200, icon:'👖', img:'', sizes:['S','M','L'],           desc:'Объёмные карманы, регулируемые штанины.'},
  {id:5, cat:'outerwear', name:'Худи Classic',      price:4200, icon:'🧶', img:'', sizes:['S','M','L','XL'],      desc:'Футер с начёсом, капюшон на шнурках, карман-кенгуру.'},
  {id:6, cat:'outerwear', name:'Зип-худи',          price:4900, icon:'🧶', img:'', sizes:['M','L'],               desc:'На молнии, два боковых кармана, плотная резинка на манжетах.'},
  {id:7, cat:'jackets',   name:'Куртка Бомбер',     price:8900, icon:'🧥', img:'', sizes:['M','L','XL'],          desc:'Лёгкая демисезонная куртка, трикотажные манжеты и воротник.'},
  {id:8, cat:'jackets',   name:'Пуховик',           price:14900,icon:'🧥', img:'', sizes:['S','M','L','XL'],      desc:'Тёплый зимний пуховик, водоотталкивающая ткань, съёмный капюшон.'}
];
/* ============================================================ */

let s = {view:'list', cat:'all', pid:null, size:null, cart:[]};
const app = document.getElementById('app');
const money = n => n.toLocaleString('ru-RU') + ' ' + CUR;
const prod  = id => PRODUCTS.find(p => p.id === id);
const count = () => s.cart.reduce((a,i) => a + i.qty, 0);
const total = () => s.cart.reduce((a,i) => a + prod(i.id).price * i.qty, 0);
const pic   = p => `<div class="pic">${p.icon}${p.img ? `<img src="${p.img}" alt="" onerror="this.remove()">` : ''}</div>`;
const ALL   = [{id:'all', name:'Все товары', icon:'🛍️'}, ...CATS];

function go(view, patch = {}) { s = {...s, view, ...patch}; render(); window.scrollTo(0,0); }
function back() { go('list'); }
function menu(open) {
  document.querySelector('.drawer').classList.toggle('open', open);
  document.querySelector('.ov').classList.toggle('show', open);
}

function addToCart() {
  if (!s.size) return;
  const it = s.cart.find(i => i.id === s.pid && i.size === s.size);
  it ? it.qty++ : s.cart.push({id:s.pid, size:s.size, qty:1});
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  go('list');
}
function changeQty(idx, d) {
  s.cart[idx].qty += d;
  if (s.cart[idx].qty <= 0) s.cart.splice(idx, 1);
  render();
}

// Текст заказа, который уйдёт продавцу
function orderText() {
  const lines = s.cart.map((i, n) => {
    const p = prod(i.id);
    return `${n+1}. ${p.name}, размер ${i.size} — ${i.qty} шт × ${money(p.price)}`;
  });
  return GREETING + '\n\n' + lines.join('\n') + '\n\nИтого: ' + money(total());
}
function checkout() {
  if (!s.cart.length) return;
  const url = 'https://t.me/' + MANAGER + '?text=' + encodeURIComponent(orderText());
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}

function header(title) {
  return `<div class="top"><button class="ic" onclick="menu(true)">☰</button><div class="ttl">${title}</div>
    <button class="ic" onclick="go('cart')">🛒${count() ? `<span class="badge">${count()}</span>` : ''}</button></div>`;
}
function drawer() {
  return `<div class="ov" onclick="menu(false)"></div><aside class="drawer"><div class="dh">Каталог</div>` +
    ALL.map(c => `<div class="item ${s.view==='list' && s.cat===c.id ? 'on' : ''}" onclick="go('list',{cat:'${c.id}'})"><span>${c.icon}</span>${c.name}</div>`).join('') + `</aside>`;
}

function render() {
  let title = 'Каталог', body = '';
  if (s.view === 'list') {
    title = ALL.find(c => c.id === s.cat).name;
    const items = PRODUCTS.filter(p => s.cat === 'all' || p.cat === s.cat);
    body = `<div class="grid">` + items.map(p =>
      `<div class="card" onclick="go('product',{pid:${p.id},size:null})">${pic(p)}<div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div>`).join('') + `</div>`;
  }
  if (s.view === 'product') {
    const p = prod(s.pid); title = 'Товар';
    body = `${tg ? '' : `<div class="back" onclick="back()">← Назад</div>`}
      <div class="big">${pic(p)}</div><h2 style="margin:6px 0">${p.name}</h2>
      <div class="price" style="font-size:18px">${money(p.price)}</div>
      <div class="desc">${p.desc}</div><div>Размер:</div>
      <div class="sizes">${p.sizes.map(z => `<div class="size ${s.size===z?'on':''}" onclick="s.size='${z}';render()">${z}</div>`).join('')}</div>
      <button class="main" ${s.size ? '' : 'disabled'} onclick="addToCart()">${s.size ? 'Добавить в корзину' : 'Выберите размер'}</button>`;
  }
  if (s.view === 'cart') {
    title = 'Корзина';
    body = tg ? '' : `<div class="back" onclick="back()">← Назад</div>`;
    if (!s.cart.length) body += `<div class="empty">Корзина пуста</div>`;
    else {
      body += s.cart.map((i, idx) => { const p = prod(i.id);
        return `<div class="row">${pic(p)}<div class="grow"><div class="name">${p.name}</div><div class="price">Размер ${i.size} · ${money(p.price)}</div></div>
        <div class="qty"><b onclick="changeQty(${idx},-1)">−</b>${i.qty}<b onclick="changeQty(${idx},1)">+</b></div></div>`; }).join('')
        + `<div class="total">Итого: ${money(total())}</div>`;
      if (!tg) body += `<button class="main" onclick="checkout()">Отправить заказ продавцу</button>`;
    }
  }
  if (s.view !== 'cart' && count() > 0)
    body += `<div class="cartbar"><button class="main" onclick="go('cart')">Корзина · ${count()} шт · ${money(total())}</button></div>`;

  app.innerHTML = drawer() + header(title) + `<div class="page">${body}</div>`;
  syncTelegramButtons();
}

function syncTelegramButtons() {
  if (!tg) return;
  s.view === 'list' ? tg.BackButton.hide() : tg.BackButton.show();
  if (s.view === 'cart' && s.cart.length) { tg.MainButton.setText('Отправить заказ · ' + money(total())); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
if (tg) { tg.BackButton.onClick(back); tg.MainButton.onClick(checkout); }

render();
</script>
</body>
</html>

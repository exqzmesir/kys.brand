<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>kys — каталог одежды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#111);
    --hint:var(--tg-theme-hint-color,#888);
    --btn:var(--tg-theme-button-color,#2481cc);
    --btn-text:var(--tg-theme-button-text-color,#fff);
    --card:var(--tg-theme-secondary-bg-color,#f2f2f5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .page{padding:0 16px 100px}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg)}
  .ttl{flex:1;font-size:20px;font-weight:700}
  .ic{position:relative;width:42px;height:42px;border:0;border-radius:12px;background:var(--card);color:var(--text);font-size:20px}
  .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--btn);color:var(--btn-text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  /* боковое меню */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .ov.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--bg);transform:translateX(-100%);transition:transform .25s;z-index:21;padding:20px 12px;overflow-y:auto}
  .drawer.open{transform:none}
  .dh{font-size:20px;font-weight:700;padding:4px 12px 14px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;font-size:16px;cursor:pointer}
  .item.on{background:var(--card);font-weight:600}
  .item span{font-size:22px;width:28px;text-align:center}
  /* товары */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border-radius:14px;padding:10px;cursor:pointer}
  .pic{position:relative;aspect-ratio:4/5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px;background:rgba(127,127,127,.12);margin-bottom:8px;overflow:hidden}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .name{font-weight:600;font-size:15px}
  .price{color:var(--hint);font-size:14px;margin-top:2px}
  .details{color:var(--hint);font-size:13px;line-height:1.4;margin:4px 0}
  .big .pic{width:100%;max-width:480px;margin:0 auto 8px;font-size:96px}
  .desc{line-height:1.45;margin:10px 0}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .size{padding:8px 14px;border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;border:2px solid transparent}
  .size.on{border-color:var(--btn)}
  .colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .color{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid transparent;border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
  .color.on{border-color:var(--btn)}
  .swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(127,127,127,.3)}
  button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600}
  button.main:disabled{opacity:.4}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
  .row .pic{width:60px;height:60px;margin:0;font-size:28px;flex:none}
  .grow{flex:1;min-width:0}
  .qty{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .qty b{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .total{font-size:18px;font-weight:700;margin:14px 0}
  .empty{color:var(--hint);text-align:center;margin-top:60px}
  .back{color:var(--btn);cursor:pointer;margin:6px 0 10px;display:inline-block}
  .cartbar{position:fixed;left:16px;right:16px;bottom:16px;z-index:4}
</style>
</head>
<body>
<div id="app"></div>

<script>
const telegramApp = window.Telegram && window.Telegram.WebApp;
const tg = telegramApp && (telegramApp.initData || telegramApp.platform !== 'unknown') ? telegramApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ================= НАСТРОЙКИ: меняйте здесь ================= */
const MANAGER  = 'exqzmesir';  // ваш username в Telegram БЕЗ значка @
const GREETING = 'Здравствуйте! Я выбрал следующие товары:';
const CUR = '₽';

const CATS = [
  {id:'hats',     name:'Ушанки',   icon:'🧢'},
  {id:'sweaters', name:'Свитеры',  icon:'🧶'},
  {id:'scarves',  name:'Шарфы',    icon:'🧣'},
  {id:'custom',   name:'Товары из Китая', icon:'📦'}
];

// img — путь к фото в репозитории, например 'images/tshirt-basic.jpg'. Пусто = показывается эмодзи.
const PRODUCTS = [
  {id:1, cat:'hats', name:'Ушанка', price:2000, icon:'🧢', img:'images/01_black_hat_kys.webp', sizes:[], colors:[
    {id:'black', name:'Чёрный', swatch:'#191919', img:'images/01_black_hat_kys.webp'},
    {id:'white', name:'Белый', swatch:'#f5efe4', img:'images/02_white_hat_kys.webp'}
  ], desc:'Ушанка с пушистой фактурой, отворотом и контрастной нашивкой. Выберите чёрный или белый цвет.'},
  {id:3, cat:'sweaters', name:'Свитер', price:3500, icon:'🧶', img:'images/03_dark_sweater_kys.webp', sizes:['M','L','XL'], colors:[
    {id:'graphite', name:'Графитовый', swatch:'#393938', img:'images/03_dark_sweater_kys.webp'},
    {id:'cream', name:'Кремовый', swatch:'#dfd1bd', img:'images/04_cream_sweater_kys.webp'}
  ], desc:'Свитер с высоким воротником и фактурной вязкой. Воротник, манжеты и низ — в рубчик.'},
  {id:5, cat:'scarves',  name:'Шарф кремовый',      price:2000, icon:'🧣', img:'images/05_cream_scarf_kys.webp',   sizes:[], desc:'Кремовый вязаный шарф с краями в рубчик и контрастной нашивкой kys.'},
  {id:6, cat:'custom', kind:'custom', name:'Заказать свой личный товар', price:null, icon:'📦', img:'', sizes:[], desc:'Закажите любой нужный вам товар из Китая. Доставка — в среднем 21 день.'}
];
/* ============================================================ */

let s = {view:'list', cat:'all', pid:null, color:null, size:null, cart:[]};
const app = document.getElementById('app');
const money = n => n.toLocaleString('ru-RU') + ' ' + CUR;
const priceText = p => p.price == null ? 'Цена по запросу' : money(p.price);
const prod  = id => PRODUCTS.find(p => p.id === id);
const colorFor = (p, id) => (p.colors || []).find(c => c.id === id);
const photoProduct = (p, colorId) => {
  const color = colorFor(p, colorId);
  return color ? {...p, img:color.img, name:p.name + ', цвет: ' + color.name.toLowerCase()} : p;
};
const itemDetails = i => {
  const color = colorFor(prod(i.id), i.color);
  return [color ? 'Цвет: ' + color.name.toLowerCase() : '', i.size ? 'Размер: ' + i.size : ''].filter(Boolean).join(' · ');
};
const count = () => s.cart.reduce((a,i) => a + i.qty, 0);
const total = () => s.cart.reduce((a,i) => a + prod(i.id).price * i.qty, 0);
const pic   = p => `<div class="pic">${p.icon}${p.img ? `<img src="${p.img}" alt="${p.name}" decoding="async" onerror="this.remove()">` : ''}</div>`;
const ALL   = [{id:'all', name:'Все товары', icon:'🛍️'}, ...CATS];

function go(view, patch = {}) { s = {...s, view, ...patch}; render(); window.scrollTo(0,0); }
function openProduct(id) {
  const p = prod(id);
  go('product', {pid:id, color:p.colors ? p.colors[0].id : null, size:null});
}
function back() { go('list'); }
function menu(open) {
  document.querySelector('.drawer').classList.toggle('open', open);
  document.querySelector('.ov').classList.toggle('show', open);
}

function addToCart() {
  const p = prod(s.pid);
  if (!p || p.kind === 'custom') return;
  if (p.sizes.length && !p.sizes.includes(s.size)) return;
  if (p.colors && !colorFor(p, s.color)) return;
  const size = p.sizes.length ? s.size : null;
  const color = p.colors ? s.color : null;
  const it = s.cart.find(i => i.id === s.pid && i.size === size && i.color === color);
  it ? it.qty++ : s.cart.push({id:s.pid, color, size, qty:1});
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  go('list');
}
function changeQty(idx, d) {
  s.cart[idx].qty += d;
  if (s.cart[idx].qty <= 0) s.cart.splice(idx, 1);
  render();
}

// Текст заказа, который уйдёт продавцу
function orderText() {
  const lines = s.cart.map((i, n) => {
    const p = prod(i.id);
    const color = colorFor(p, i.color);
    const details = [color ? 'цвет: ' + color.name.toLowerCase() : '', i.size ? 'размер: ' + i.size : ''].filter(Boolean).join(', ');
    return `${n+1}. ${p.name}${details ? ', ' + details : ''} — ${i.qty} шт. × ${money(p.price)} = ${money(p.price * i.qty)}`;
  });
  return GREETING + '\n\n' + lines.join('\n') + '\n\nИтого: ' + money(total()) + '\n\nХочу продолжить оформление заказа.';
}
function checkout() {
  if (!s.cart.length) return;
  openManager(orderText());
}
function openManager(text) {
  const url = 'https://t.me/' + MANAGER + '?text=' + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.location.assign(url);
}
function customOrder() {
  if (prod(s.pid)?.kind !== 'custom') return;
  openManager('Здравствуйте! Хочу заказать свой личный товар из Китая. Помогите уточнить стоимость и продолжить оформление заказа.');
}

function header(title) {
  return `<div class="top"><button class="ic" aria-label="Открыть меню" onclick="menu(true)">☰</button><div class="ttl">${title}</div>
    <button class="ic" aria-label="Открыть корзину" onclick="go('cart')">🛒${count() ? `<span class="badge">${count()}</span>` : ''}</button></div>`;
}
function drawer() {
  return `<div class="ov" onclick="menu(false)"></div><aside class="drawer"><div class="dh">kys · Каталог</div>` +
    ALL.map(c => `<div class="item ${s.view==='list' && s.cat===c.id ? 'on' : ''}" onclick="go('list',{cat:'${c.id}'})"><span>${c.icon}</span>${c.name}</div>`).join('') + `</aside>`;
}

function render() {
  let title = 'Каталог', body = '';
  if (s.view === 'list') {
    title = ALL.find(c => c.id === s.cat).name;
    const items = PRODUCTS.filter(p => s.cat === 'all' || p.cat === s.cat);
    body = `<div class="grid">` + items.map(p =>
      `<div class="card" onclick="openProduct(${p.id})">${pic(p)}<div class="name">${p.name}</div>${p.colors ? `<div class="details">${p.colors.map(c => c.name).join(' · ')}</div>` : ''}<div class="price">${priceText(p)}</div></div>`).join('') + `</div>`;
  }
  if (s.view === 'product') {
    const p = prod(s.pid); title = 'Товар';
    const needsSize = p.sizes.length > 0;
    body = `${tg ? '' : `<div class="back" onclick="back()">← Назад</div>`}
      ${p.kind === 'custom' ? `<h2 style="margin:6px 0">${p.name}</h2><div class="desc">${p.desc}</div>
      <div class="desc">Стоимость товара и доставки уточним по ссылке или фотографии.</div>
      <button class="main" onclick="customOrder()">Обсудить заказ в Telegram</button>` : `
      <div class="big">${pic(photoProduct(p, s.color))}</div><h2 style="margin:6px 0">${p.name}</h2>
      <div class="price" style="font-size:18px">${money(p.price)}</div>
      <div class="desc">${p.desc}</div>
      ${p.colors ? `<div>Цвет:</div><div class="colors" role="group" aria-label="Цвет товара">${p.colors.map(c => `<button type="button" class="color ${s.color===c.id?'on':''}" aria-pressed="${s.color===c.id}" onclick="s.color='${c.id}';render()"><span class="swatch" style="background:${c.swatch}" aria-hidden="true"></span>${c.name}</button>`).join('')}</div>` : ''}
      ${needsSize ? `<div>Размер:</div><div class="sizes" role="group" aria-label="Размер товара">${p.sizes.map(z => `<button type="button" class="size ${s.size===z?'on':''}" aria-pressed="${s.size===z}" onclick="s.size='${z}';render()">${z}</button>`).join('')}</div>` : ''}
      <button class="main" ${needsSize && !s.size ? 'disabled' : ''} onclick="addToCart()">${needsSize && !s.size ? 'Выберите размер' : 'Добавить в корзину'}</button>`}`;
  }
  if (s.view === 'cart') {
    title = 'Корзина';
    body = tg ? '' : `<div class="back" onclick="back()">← Назад</div>`;
    if (!s.cart.length) body += `<div class="empty">Корзина пуста</div>`;
    else {
      body += s.cart.map((i, idx) => { const p = prod(i.id);
        return `<div class="row">${pic(photoProduct(p, i.color))}<div class="grow"><div class="name">${p.name}</div>${itemDetails(i) ? `<div class="details">${itemDetails(i)}</div>` : ''}<div class="price">${money(p.price)}</div></div>
        <div class="qty"><b onclick="changeQty(${idx},-1)">−</b>${i.qty}<b onclick="changeQty(${idx},1)">+</b></div></div>`; }).join('')
        + `<div class="total">Итого: ${money(total())}</div>`;
      body += `<button class="main" onclick="checkout()">Оформить заказ</button><div class="details">Откроется чат с @${MANAGER} с готовой заявкой.</div>`;
    }
  }
  if (s.view !== 'cart' && count() > 0)
    body += `<div class="cartbar"><button class="main" onclick="go('cart')">Корзина · ${count()} шт · ${money(total())}</button></div>`;

  app.innerHTML = drawer() + header(title) + `<div class="page">${body}</div>`;
  syncTelegramButtons();
}

function syncTelegramButtons() {
  if (!tg) return;
  s.view === 'list' ? tg.BackButton.hide() : tg.BackButton.show();
  if (s.view === 'cart' && s.cart.length) { tg.MainButton.setText('Оформить заказ · ' + money(total())); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
if (tg) { tg.BackButton.onClick(back); tg.MainButton.onClick(checkout); }

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Каталог одежды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:var(--tg-theme-bg-color,#fff);
    --text:var(--tg-theme-text-color,#111);
    --hint:var(--tg-theme-hint-color,#888);
    --btn:var(--tg-theme-button-color,#2481cc);
    --btn-text:var(--tg-theme-button-text-color,#fff);
    --card:var(--tg-theme-secondary-bg-color,#f2f2f5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px 16px 90px}
  h1{font-size:22px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border-radius:14px;padding:14px;cursor:pointer}
  .pic{height:110px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px;background:rgba(127,127,127,.12);margin-bottom:8px;overflow:hidden}
  .pic img{width:100%;height:100%;object-fit:cover}
  .name{font-weight:600;font-size:15px}
  .price{color:var(--hint);font-size:14px;margin-top:2px}
  .big .pic{height:220px;font-size:96px}
  .desc{line-height:1.45;margin:10px 0}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .size{padding:8px 14px;border-radius:10px;background:var(--card);cursor:pointer;border:2px solid transparent}
  .size.on{border-color:var(--btn)}
  button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-text);font-size:16px;font-weight:600}
  button.main:disabled{opacity:.4}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
  .row .pic{width:56px;height:56px;margin:0;font-size:28px;flex:none}
  .grow{flex:1}
  .qty{display:flex;align-items:center;gap:10px}
  .qty b{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .total{font-size:18px;font-weight:700;margin:14px 0}
  .empty{color:var(--hint);text-align:center;margin-top:60px}
  .back{color:var(--btn);cursor:pointer;margin-bottom:10px;display:inline-block}
  .cartbar{position:fixed;left:16px;right:16px;bottom:16px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ====== ДАННЫЕ: меняйте здесь ====== */
const CUR = '₽';
const CATS = [
  {id:'tshirts', name:'Футболки', icon:'👕'},
  {id:'hoodies', name:'Худи',     icon:'🧥'},
  {id:'pants',   name:'Брюки',    icon:'👖'},
  {id:'shoes',   name:'Обувь',    icon:'👟'}
];
const PRODUCTS = [
  {id:1, cat:'tshirts', name:'Футболка Basic',  price:1500, icon:'👕', img:'', sizes:['S','M','L','XL'], desc:'Плотный хлопок 100%, свободный крой. Подходит на каждый день.'},
  {id:2, cat:'tshirts', name:'Футболка Oversize', price:1900, icon:'👕', img:'', sizes:['M','L','XL'], desc:'Оверсайз-силуэт, спущенное плечо, мягкая ткань.'},
  {id:3, cat:'hoodies', name:'Худи Classic',    price:4200, icon:'🧥', img:'', sizes:['S','M','L','XL'], desc:'Футер с начёсом, капюшон на шнурках, карман-кенгуру.'},
  {id:4, cat:'hoodies', name:'Зип-худи',        price:4900, icon:'🧥', img:'', sizes:['M','L'], desc:'На молнии, два боковых кармана, плотная резинка на манжетах.'},
  {id:5, cat:'pants',   name:'Джинсы Straight', price:5500, icon:'👖', img:'', sizes:['30','32','34','36'], desc:'Прямой крой, плотный деним, классическая посадка.'},
  {id:6, cat:'pants',   name:'Карго',           price:5200, icon:'👖', img:'', sizes:['S','M','L'], desc:'Объёмные карманы, регулируемые штанины.'},
  {id:7, cat:'shoes',   name:'Кеды Low',        price:6300, icon:'👟', img:'', sizes:['40','41','42','43','44'], desc:'Низкие кеды, резиновая подошва, натуральная кожа.'}
];
/* ==================================== */

let s = {view:'home', cat:null, pid:null, size:null, cart:[]};
const app = document.getElementById('app');
const money = n => n.toLocaleString('ru-RU') + ' ' + CUR;
const prod = id => PRODUCTS.find(p => p.id === id);
const count = () => s.cart.reduce((a,i) => a + i.qty, 0);
const total = () => s.cart.reduce((a,i) => a + prod(i.id).price * i.qty, 0);
const pic = p => `<div class="pic">${p.img ? `<img src="${p.img}" alt="">` : p.icon}</div>`;

function go(view, patch = {}) { s = {...s, view, ...patch}; render(); window.scrollTo(0,0); }
function back() {
  if (s.view === 'product') go('list');
  else if (s.view === 'cart') go(s.cat ? 'list' : 'home');
  else go('home', {cat:null});
}

function addToCart() {
  if (!s.size) return;
  const it = s.cart.find(i => i.id === s.pid && i.size === s.size);
  it ? it.qty++ : s.cart.push({id:s.pid, size:s.size, qty:1});
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  go('list');
}
function changeQty(idx, d) {
  s.cart[idx].qty += d;
  if (s.cart[idx].qty <= 0) s.cart.splice(idx, 1);
  render();
}
function checkout() {
  const order = {items: s.cart.map(i => ({id:i.id, size:i.size, qty:i.qty})), total: total()};
  if (tg && tg.initData) tg.sendData(JSON.stringify(order)); // закрывает приложение и отправляет данные боту
  else alert('Заказ (тест в браузере):\n' + JSON.stringify(order, null, 2));
}

function render() {
  let h = '';
  if (s.view === 'home') {
    h = `<h1>Категории</h1><div class="grid">` +
      CATS.map(c => `<div class="card" onclick="go('list',{cat:'${c.id}'})"><div class="pic">${c.icon}</div><div class="name">${c.name}</div></div>`).join('') + `</div>`;
  }
  if (s.view === 'list') {
    const c = CATS.find(c => c.id === s.cat);
    h = `<h1>${c.name}</h1><div class="grid">` +
      PRODUCTS.filter(p => p.cat === s.cat).map(p => `<div class="card" onclick="go('product',{pid:${p.id},size:null})">${pic(p)}<div class="name">${p.name}</div><div class="price">${money(p.price)}</div></div>`).join('') + `</div>`;
  }
  if (s.view === 'product') {
    const p = prod(s.pid);
    h = `<div class="big">${pic(p)}</div><h1>${p.name}</h1><div class="price" style="font-size:18px">${money(p.price)}</div>
      <div class="desc">${p.desc}</div><div>Размер:</div>
      <div class="sizes">${p.sizes.map(z => `<div class="size ${s.size===z?'on':''}" onclick="s.size='${z}';render()">${z}</div>`).join('')}</div>
      <button class="main" ${s.size?'':'disabled'} onclick="addToCart()">${s.size ? 'Добавить в корзину' : 'Выберите размер'}</button>`;
  }
  if (s.view === 'cart') {
    h = `<h1>Корзина</h1>`;
    if (!s.cart.length) h += `<div class="empty">Корзина пуста</div>`;
    else h += s.cart.map((i,idx) => { const p = prod(i.id); return `<div class="row">${pic(p)}<div class="grow"><div class="name">${p.name}</div><div class="price">Размер ${i.size} · ${money(p.price)}</div></div><div class="qty"><b onclick="changeQty(${idx},-1)">−</b>${i.qty}<b onclick="changeQty(${idx},1)">+</b></div></div>`; }).join('')
      + `<div class="total">Итого: ${money(total())}</div>`;
  }
  // кнопка корзины внизу (вне самой корзины)
  if (s.view !== 'cart' && count() > 0) h += `<div class="cartbar"><button class="main" onclick="go('cart')">Корзина · ${count()} шт · ${money(total())}</button></div>`;
  if (s.view === 'cart' && s.cart.length && !tg) h += `<button class="main" onclick="checkout()">Оформить заказ</button>`;
  app.innerHTML = h;
  syncTelegramButtons();
}

function syncTelegramButtons() {
  if (!tg) return;
  s.view === 'home' ? tg.BackButton.hide() : tg.BackButton.show();
  if (s.view === 'cart' && s.cart.length) { tg.MainButton.setText('Оформить заказ · ' + money(total())); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
if (tg) { tg.BackButton.onClick(back); tg.MainButton.onClick(checkout); }

render();
</script>
</body>
</html>
